{% extends 'base.html' %}

{% block title %}{% if review %}Редактировать{% else %}Создать{% endif %} отзыв{% endblock %}

{% block content %}
<div style="padding: 20px;">
    <h1>{% if review %}Редактировать{% else %}Создать{% endif %} отзыв</h1>
    <div class="quote-box">
        <form method="post">
            {% csrf_token %}
            <div style="margin-bottom: 15px;">
                <label for="rating">Оценка:</label>
                <select name="rating" id="rating" required>
                    <option value="5" {% if review.rating == 5 %}selected{% endif %}>5 звезд</option>
                    <option value="4" {% if review.rating == 4 %}selected{% endif %}>4 звезды</option>
                    <option value="3" {% if review.rating == 3 %}selected{% endif %}>3 звезды</option>
                    <option value="2" {% if review.rating == 2 %}selected{% endif %}>2 звезды</option>
                    <option value="1" {% if review.rating == 1 %}selected{% endif %}>1 звезда</option>
                </select>
            </div>
            <div style="margin-bottom: 15px;">
                <label for="text">Отзыв:</label>
                <textarea name="text" id="text" rows="5" required>{% if review %}{{ review.text }}{% endif %}</textarea>
            </div>
            <button type="submit">{% if review %}Обновить{% else %}Отправить{% endif %}</button>
        </form>
    </div>
</div>
{% endblock %}

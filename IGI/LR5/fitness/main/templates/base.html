<!DOCTYPE html>
<html>
<head>
    <title>Фитнес-клуб - {% block title %}{% endblock %}</title>
    <style>
        body { margin: 0; padding: 20px; }
        .nav { margin-bottom: 20px; }
        .nav a { margin-right: 10px; }
    </style>
</head>
<body>
    <div class="nav">        <!-- Основная навигация -->
        <div>
            <a href="{% url 'main:home' %}">Главная</a>
            <a href="{% url 'main:news' %}">Новости</a>
            <a href="{% url 'main:about' %}">О компании</a>
            <a href="{% url 'main:groups' %}">Группы</a>
            <a href="{% url 'main:staff' %}">Контакты</a>
            <a href="{% url 'main:faq' %}">FAQ</a>
            <a href="{% url 'main:privacy_policy' %}">Политика конфиденциальности</a>
            <a href="{% url 'main:reviews' %}">Отзывы</a>
            <a href="{% url 'main:vacancies' %}">Вакансии</a>
            <a href="{% url 'main:promos' %}">Акции</a>
        </div><!-- Навигация для услуг -->

        <!-- Авторизация и личный кабинет -->
        <div>            {% if user.is_authenticated %}
                <a href="{% url 'main:logout' %}">Выйти</a>
            {% else %}
                <a href="{% url 'main:login' %}">Войти</a>
                <a href="{% url 'main:register' %}">Регистрация</a>
            {% endif %}
        </div>
    </div>

    {% block content %}
    {% endblock %}

    <div style="margin-top: 20px; text-align: center;">
        Валиуллин Константин | Группа 353504 | Май 2025
    </div>
</body>
</html>
